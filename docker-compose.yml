name: expense

networks:
  expense:

volumes:
  db-volume:

services:

  mysql:
    container_name: mysql
    image: chandrahari321/mysql:v1.0.0

    volumes:
      - db-volume:/var/lib/mysql

    networks:
      - expense

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    container_name: backend
    image: chandrahari321/backend:v2.0.0

    networks:
      - expense

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    container_name: frontend
    image: chandrahari321/frontend:v2.0.0

    networks:
      - expense

    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy

    ports:
      - "80:80"